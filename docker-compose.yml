services:
  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+asyncpg://ridgitech:ridgitech@postgres:5432/ridgitech
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
    command: ["arq", "backend.worker.WorkerSettings"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen/qwen3.8-27b}
      DATABASE_URL: postgresql+asyncpg://ridgitech:ridgitech@postgres:5432/ridgitech
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-60}
      ANALYTICS_BACKEND: ${ANALYTICS_BACKEND:-fixture}
      ONEC_DATA_URL: http://onec-data:8011
      ONEC_DATA_TOKEN: ${ONEC_DATA_TOKEN:-}
      ONEC_ALLOW_DEMO_METRICS: ${ONEC_ALLOW_DEMO_METRICS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "--check", "backend.worker.WorkerSettings"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  onec-data:
    profiles: [onec]
    build:
      context: .
    command: ["uvicorn", "services.onec_data.main:app", "--host", "0.0.0.0", "--port", "8011"]
    environment:
      ODATA_BASE_URL: ${ODATA_BASE_URL:-https://176.108.255.199.sslip.io/Itmo/odata/standard.odata}
      ODATA_USERNAME: ${ODATA_USERNAME:-odata}
      ODATA_PASSWORD: ${ODATA_PASSWORD:-}
      ONEC_DATA_TOKEN: ${ONEC_DATA_TOKEN:-}
      ONEC_BASE_ID: ${ONEC_BASE_ID:-itmo}
      ONEC_ORGANIZATION_IDS: ${ONEC_ORGANIZATION_IDS:-}
      ODATA_PAGE_SIZE: ${ODATA_PAGE_SIZE:-100}
      ODATA_MAX_ROWS: ${ODATA_MAX_ROWS:-5000}
      ODATA_REQUESTS_PER_SECOND: ${ODATA_REQUESTS_PER_SECOND:-2}
    ports:
      - "127.0.0.1:8011:8011"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ridgitech
      POSTGRES_USER: ridgitech
      POSTGRES_PASSWORD: ridgitech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridgitech -d ridgitech"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
