services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: web
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_SESSION_MINUTES: ${JWT_SESSION_MINUTES:-720}
      CHAT_ORGANIZATION_ID: ${CHAT_ORGANIZATION_ID:-demo-org}
      DATABASE_URL: postgresql+asyncpg://ridgitech:ridgitech@postgres:5432/ridgitech
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json
          import urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3) as response:
              result = json.load(response)
          raise SystemExit(0 if result['status'] == 'ok' else 1)
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: backend
    command: ["arq", "backend.worker.WorkerSettings"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen/qwen3.8-27b}
      DATABASE_URL: postgresql+asyncpg://ridgitech:ridgitech@postgres:5432/ridgitech
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-60}
      ANALYTICS_BACKEND: ${ANALYTICS_BACKEND:-fixture}
      ONEC_DATA_URL: http://onec-data:8011
      ONEC_DATA_TOKEN: ${ONEC_DATA_TOKEN:-}
      ONEC_ALLOW_DEMO_METRICS: ${ONEC_ALLOW_DEMO_METRICS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "--check", "backend.worker.WorkerSettings"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  onec-data:
    profiles: [onec]
    build:
      context: .
      target: backend
    command: ["uvicorn", "services.onec_data.main:app", "--host", "0.0.0.0", "--port", "8011"]
    environment:
      ODATA_BASE_URL: ${ODATA_BASE_URL:-https://176.108.255.199.sslip.io/Itmo/odata/standard.odata}
      ODATA_USERNAME: ${ODATA_USERNAME:-odata}
      ODATA_PASSWORD: ${ODATA_PASSWORD:-}
      ONEC_DATA_TOKEN: ${ONEC_DATA_TOKEN:-}
      ONEC_BASE_ID: ${ONEC_BASE_ID:-itmo}
      ONEC_ORGANIZATION_IDS: ${ONEC_ORGANIZATION_IDS:-}
      ODATA_PAGE_SIZE: ${ODATA_PAGE_SIZE:-100}
      ODATA_MAX_ROWS: ${ODATA_MAX_ROWS:-5000}
      ODATA_REQUESTS_PER_SECOND: ${ODATA_REQUESTS_PER_SECOND:-2}
      ODATA_TIMEOUT_SECONDS: ${ODATA_TIMEOUT_SECONDS:-15}
      ODATA_CONNECT_TIMEOUT_SECONDS: ${ODATA_CONNECT_TIMEOUT_SECONDS:-${ODATA_TIMEOUT_SECONDS:-15}}
      ODATA_READ_TIMEOUT_SECONDS: ${ODATA_READ_TIMEOUT_SECONDS:-${ODATA_TIMEOUT_SECONDS:-15}}
      ODATA_WRITE_TIMEOUT_SECONDS: ${ODATA_WRITE_TIMEOUT_SECONDS:-${ODATA_TIMEOUT_SECONDS:-15}}
      ODATA_POOL_TIMEOUT_SECONDS: ${ODATA_POOL_TIMEOUT_SECONDS:-${ODATA_TIMEOUT_SECONDS:-15}}
      ODATA_MAX_RETRIES: ${ODATA_MAX_RETRIES:-1}
      ODATA_RETRY_BACKOFF_SECONDS: ${ODATA_RETRY_BACKOFF_SECONDS:-0.5}
      ODATA_MAX_CONNECTIONS: ${ODATA_MAX_CONNECTIONS:-4}
      ONEC_METADATA_TTL_SECONDS: ${ONEC_METADATA_TTL_SECONDS:-900}
      ONEC_METADATA_REFRESH_SECONDS: ${ONEC_METADATA_REFRESH_SECONDS:-86400}
      ONEC_METADATA_STATE_DIR: /app/runs/onec-metadata
      ONEC_CATALOG_TTL_SECONDS: ${ONEC_CATALOG_TTL_SECONDS:-60}
      ONEC_DIMENSION_SEARCH_LIMIT: ${ONEC_DIMENSION_SEARCH_LIMIT:-20}
    volumes:
      - onec_metadata:/app/runs/onec-metadata
    ports:
      - "127.0.0.1:8011:8011"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ridgitech
      POSTGRES_USER: ridgitech
      POSTGRES_PASSWORD: ridgitech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridgitech -d ridgitech"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  onec_metadata:
  postgres_data:
  redis_data:
