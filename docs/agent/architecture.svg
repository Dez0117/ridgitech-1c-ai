<svg xmlns="http://www.w3.org/2000/svg" width="2020" height="1600" viewBox="0 0 2020 1600" role="img" aria-labelledby="title desc">
<title id="title">Архитектура AI-агента для аналитики 1С</title>
<desc id="desc">Граф LangGraph управляет контекстом, планированием, валидацией, вызовами LangChain tools, уточнениями и ответом. Локальная модель Qwen3.8-27B или DeepSeek-V4-Flash обслуживается через vLLM. Расчётные инструменты обращаются к API данных, который читает штатный OData 1С. PostgreSQL сохраняет checkpoints и аудит, Redis хранит кэш, локальная наблюдаемость собирает трейсы и оценки качества.</desc>
<rect width="2020" height="1600" fill="#f8fafc" />

