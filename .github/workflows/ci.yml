name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ridgitech
          POSTGRES_USER: ridgitech
          POSTGRES_PASSWORD: ridgitech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ridgitech -d ridgitech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ridgitech:ridgitech@localhost:5432/ridgitech
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[backend,test]"
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker compose up --detach --build --wait
      - run: curl --fail --show-error http://localhost:8000/health | grep --fixed-strings '"status":"ok"'
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
