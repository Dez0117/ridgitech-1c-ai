[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ridgitech-agent-tools"
version = "0.2.0"
description = "LangGraph analytics agent and reproducible Qwen evaluation runs"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.7,<2",
    "langgraph>=1.2,<2",
    "langchain-openrouter>=0.2.9,<0.3",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.2,<2",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
backend = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "redis>=5.2,<7",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
]
test = [
    "aiosqlite>=0.20,<1",
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[project.scripts]
ridgitech-agent = "agent.__main__:main"

[tool.setuptools.packages.find]
include = ["tools*", "agent*", "backend*"]

[tool.setuptools.package-data]
tools = ["*.md"]
agent = ["prompts/*.md", "fixtures/*.json"]
